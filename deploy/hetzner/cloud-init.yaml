#cloud-config
#
# Shiftella web host: Hetzner Cloud, Ubuntu 24.04.
# Paste this into "Cloud config" when creating the server (see README.md, step 2).
#
# BEFORE PASTING, replace the two placeholder keys below:
#   REPLACE_WITH_YOUR_PERSONAL_SSH_PUBLIC_KEY  -> your own key (~/.ssh/id_ed25519.pub);
#                                                user "ops", has sudo
#   REPLACE_WITH_GITHUB_DEPLOY_SSH_PUBLIC_KEY  -> the deploy key generated for GitHub
#                                                Actions (README step 1); user "deploy", no sudo
# Root login and password login are disabled, so without your personal key in
# place you can only get in via the Hetzner web console.
#
# Result:
#   - users: ops (sudo, your key), deploy (owns /srv/shiftella only, CI key)
#   - ssh: keys only, no root, only ops + deploy
#   - ufw: 22/tcp, 80/tcp, 443/tcp, 443/udp (HTTP/3); fail2ban on sshd
#   - unattended security upgrades (+ Caddy), automatic reboot at 03:30 if needed
#   - Caddy from the official apt repo (config: deploy/hetzner/Caddyfile, copied in README step 5)
#   - /srv/shiftella/{prod,dev}/releases/<sha> + current/previous symlinks,
#     with a placeholder page live until the first deploy

timezone: Europe/Prague
package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - python3-systemd
  - unattended-upgrades
  - rsync
  - curl
  - gnupg
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https

ssh_pwauth: false
disable_root: true

users:
  - name: ops
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "REPLACE_WITH_YOUR_PERSONAL_SSH_PUBLIC_KEY"
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "REPLACE_WITH_GITHUB_DEPLOY_SSH_PUBLIC_KEY"

write_files:
  # Read before cloud-init's own 50-cloud-init.conf; the first value wins in sshd.
  - path: /etc/ssh/sshd_config.d/10-shiftella-hardening.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AllowUsers ops deploy
      MaxAuthTries 3
      X11Forwarding no

  - path: /etc/fail2ban/jail.local
    permissions: "0644"
    content: |
      [DEFAULT]
      bantime  = 1h
      findtime = 10m
      maxretry = 5

      [sshd]
      enabled = true
      backend = systemd

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/52unattended-upgrades-shiftella
    permissions: "0644"
    content: |
      // Also keep Caddy (official repo) patched, not just Ubuntu security updates.
      Unattended-Upgrade::Origins-Pattern {
              "site=dl.cloudsmith.io";
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      // Kernel updates need a reboot; a static site is back in ~30 s.
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "03:30";

  # Shown until the first real deploy replaces it.
  - path: /srv/shiftella/bootstrap/index.html
    permissions: "0644"
    content: |
      <!doctype html>
      <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Shiftella</title></head>
      <body style="font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0">
      <p>Shiftella is being set up. Check back soon.</p></body></html>

runcmd:
  # --- Caddy from the official repository (https://caddyserver.com/docs/install#debian-ubuntu-raspbian)
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --batch --yes --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' -o /etc/apt/sources.list.d/caddy-stable.list
  - chmod o+r /usr/share/keyrings/caddy-stable-archive-keyring.gpg /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
  - systemctl enable caddy

  # --- Release layout: /srv/shiftella/<site>/releases/<sha>, current -> releases/<sha>
  - install -d -o deploy -g deploy -m 755 /srv/shiftella /srv/shiftella/bin
  - |
    for site in prod dev; do
      install -d -o deploy -g deploy -m 755 /srv/shiftella/$site /srv/shiftella/$site/releases
      install -d -o deploy -g deploy -m 755 /srv/shiftella/$site/releases/bootstrap
      install -o deploy -g deploy -m 644 /srv/shiftella/bootstrap/index.html /srv/shiftella/$site/releases/bootstrap/index.html
      ln -sfn releases/bootstrap /srv/shiftella/$site/current
      chown -h deploy:deploy /srv/shiftella/$site/current
    done
  - rm -rf /srv/shiftella/bootstrap

  # --- Firewall (also consider a free Hetzner Cloud Firewall with the same rules)
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable

  # --- Services
  - systemctl enable --now fail2ban
  - systemctl enable --now unattended-upgrades
  - systemctl restart ssh

final_message: "Shiftella host ready after $UPTIME s. Next: DNS records, then copy deploy/hetzner/Caddyfile to /etc/caddy/Caddyfile (README step 5)."
