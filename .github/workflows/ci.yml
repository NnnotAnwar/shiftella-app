name: CI

# Verify every PR (and pushes to the release branches) before it can be merged:
# type-check, lint, unit tests, and a production build. This would have caught
# the broken build that previously only failed on Vercel.

on:
  pull_request:
  push:
    branches: [master, dev, preview]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Yarn Berry via Corepack (version pinned by package.json "packageManager").
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Build (tsc -b + vite build)
        run: yarn build

  # The Shiftella site file for the shared edge Caddy (deploy/hetzner/) must
  # parse and provision with the server's Caddy version. Installing it on the
  # server stays a manual step (it needs a Caddy reload).
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy/hetzner/shiftella.caddy
        run: bash deploy/hetzner/ci/validate-caddy.sh

      - name: Lint the release + setup scripts
        run: |
          bash -n deploy/hetzner/bin/shiftella-release
          bash -n deploy/hetzner/setup-shared.sh
          shellcheck -S warning deploy/hetzner/bin/shiftella-release deploy/hetzner/setup-shared.sh deploy/hetzner/ci/validate-caddy.sh
